name: Deploy Godot Web to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate static Web export
        shell: bash
        run: |
          test -s dist/web/index.html
          test -s dist/web/index.wasm
          test -s dist/web/index.pck
          test "$(stat -c%s dist/web/index.pck)" -lt 100000000
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Web export
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
