<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080b10">
  <title>MY NAME IS DENIS: COLD MILK, PLEASE</title>
  <style>
    :root { color-scheme: dark; --amber:#f2bd58; --ink:#080b10; --panel:rgba(12,17,23,.96); }
    * { box-sizing:border-box; }
    html,body,#canvas { width:100%; height:100%; margin:0; border:0; }
    body { overflow:hidden; background:#080b10; color:#f5f1e8; font-family:Arial,sans-serif; touch-action:none; }
    #canvas { display:block; background:#080b10; }
    #canvas:focus { outline:none; }
    #status { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:24px;
      background:radial-gradient(circle at 50% 38%,#202831 0,#0d1218 42%,#05070a 100%); }
    #status.hidden { display:none; }
    .card { width:min(620px,94vw); padding:34px 36px; border:1px solid rgba(242,189,88,.35); border-radius:18px;
      background:linear-gradient(145deg,rgba(18,24,31,.98),rgba(8,11,16,.98)); box-shadow:0 24px 80px #000b; text-align:center; }
    .cup { position:relative; width:66px; height:50px; margin:0 auto 22px; border:5px solid var(--amber); border-top:0;
      border-radius:5px 5px 22px 22px; animation:float 2.4s ease-in-out infinite; }
    .cup:after { content:""; position:absolute; right:-25px; top:9px; width:22px; height:22px; border:5px solid var(--amber); border-left:0; border-radius:0 18px 18px 0; }
    .steam { position:absolute; left:20px; bottom:49px; width:7px; height:25px; border-left:3px solid #f8e9c9; border-radius:50%; opacity:.65; animation:steam 1.7s ease-in-out infinite; }
    .steam.two { left:39px; animation-delay:.55s; }
    h1 { margin:0 0 12px; color:var(--amber); font-size:clamp(23px,4vw,36px); letter-spacing:.04em; }
    #status-copy { min-height:24px; margin:0 0 16px; color:#d8dbe0; }
    #status-progress { width:100%; height:8px; margin:3px 0 9px; accent-color:var(--amber); display:none; }
    #status-percent { min-height:20px; color:#aab0b8; font-size:13px; }
    .buttons { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:19px; }
    button { border:1px solid #5c6570; border-radius:8px; padding:10px 14px; color:#f5f1e8; background:#171d24; cursor:pointer; font-weight:700; }
    button:hover,button:focus-visible { border-color:var(--amber); color:var(--amber); outline:none; }
    button.primary { min-width:190px; color:#16130b; background:var(--amber); border-color:var(--amber); }
    button:disabled { opacity:.45; cursor:wait; }
    #status-notice { display:none; margin-top:14px; padding:12px; border-radius:8px; background:#532b31; white-space:pre-line; }
    #mobile-warning { display:none; margin:14px 0; padding:12px; border:1px solid #8c6432; border-radius:8px; background:#2b2116; }
    #toolbar { position:fixed; right:12px; top:12px; z-index:12; display:none; gap:6px; padding:6px; border-radius:10px; background:rgba(8,11,16,.82); opacity:.23; transition:opacity .2s; }
    #toolbar:hover,#toolbar:focus-within { opacity:1; }
    #toolbar button { padding:7px 9px; font-size:12px; }
    #dialog-backdrop { position:fixed; inset:0; z-index:30; display:none; place-items:center; padding:20px; background:#000b; }
    #dialog-backdrop.open { display:grid; }
    .dialog { width:min(540px,94vw); padding:24px; border:1px solid #59616c; border-radius:14px; background:var(--panel); }
    .dialog h2 { margin-top:0; color:var(--amber); }
    .controls { display:grid; grid-template-columns:auto 1fr; gap:9px 18px; }
    .controls b { color:#fff; }
    @keyframes float { 50% { transform:translateY(-5px); } }
    @keyframes steam { 0% { transform:translateY(7px) scale(.8); opacity:0; } 45% { opacity:.7; } 100% { transform:translateY(-15px) scale(1.15); opacity:0; } }
    @media (max-width:700px) { .card { padding:25px 18px; } #toolbar { flex-direction:column; } }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <canvas id="canvas" tabindex="0">Ваш браузер не поддерживает Canvas.</canvas>
  <noscript>Для запуска игры требуется JavaScript.</noscript>

  <section id="status" aria-live="polite">
    <div class="card">
      <div class="cup"><i class="steam"></i><i class="steam two"></i></div>
      <h1>MY NAME IS DENIS: COLD MILK, PLEASE</h1>
      <p id="status-copy">НАЖМИТЕ, ЧТОБЫ НАЧАТЬ</p>
      <div id="mobile-warning">Для игры требуются компьютер, клавиатура и мышь.</div>
      <progress id="status-progress"></progress>
      <div id="status-percent"></div>
      <div id="status-notice"></div>
      <div class="buttons">
        <button id="play" class="primary">ИГРАТЬ</button>
        <button data-fullscreen>НА ВЕСЬ ЭКРАН</button>
        <button data-sound>ЗВУК: ВКЛ</button>
        <button data-reset>СБРОСИТЬ СОХРАНЕНИЕ</button>
        <button data-controls>УПРАВЛЕНИЕ</button>
      </div>
    </div>
  </section>

  <nav id="toolbar" aria-label="Web-управление">
    <button data-fullscreen title="На весь экран">⛶</button>
    <button data-sound title="Звук">🔊</button>
    <button data-reset title="Сбросить сохранение">↺</button>
    <button data-controls title="Управление">?</button>
  </nav>

  <div id="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog">
      <h2 id="dialog-title">УПРАВЛЕНИЕ</h2>
      <div class="controls">
        <b>WASD</b><span>движение</span>
        <b>МЫШЬ</b><span>обзор</span>
        <b>ЛКМ</b><span>взять или поставить</span>
        <b>E</b><span>взаимодействие и наливание</span>
        <b>ПКМ</b><span>стабилизация при наливании</span>
        <b>ESC</b><span>освободить мышь</span>
      </div>
      <div class="buttons"><button id="close-dialog" class="primary">ПОНЯТНО</button></div>
    </div>
  </div>

  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":41063024,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const copy = document.getElementById('status-copy');
    const progress = document.getElementById('status-progress');
    const percent = document.getElementById('status-percent');
    const notice = document.getElementById('status-notice');
    const play = document.getElementById('play');
    const toolbar = document.getElementById('toolbar');
    const dialog = document.getElementById('dialog-backdrop');
    let starting = false;
    let running = false;
    let resetAfterStart = false;
    let muted = false;
    const audioContexts = new Set();

    const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
    if (NativeAudioContext) {
      function TrackedAudioContext(...args) {
        const context = new NativeAudioContext(...args);
        audioContexts.add(context);
        if (muted) context.suspend();
        return context;
      }
      TrackedAudioContext.prototype = NativeAudioContext.prototype;
      Object.setPrototypeOf(TrackedAudioContext, NativeAudioContext);
      window.AudioContext = TrackedAudioContext;
      if (window.webkitAudioContext) window.webkitAudioContext = TrackedAudioContext;
    }

    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    const mobile = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 900;
    if (mobile) {
      document.getElementById('mobile-warning').style.display = 'block';
      play.textContent = 'ВСЁ РАВНО ЗАПУСТИТЬ';
    }

    function setFailure(error) {
      console.error(error);
      notice.textContent = error instanceof Error ? error.message : String(error);
      notice.style.display = 'block';
      copy.textContent = 'НЕ УДАЛОСЬ ЗАПУСТИТЬ ИГРУ';
      play.disabled = false;
      starting = false;
    }

    async function startGame() {
      if (starting || running) {
        canvas.focus();
        return;
      }
      // Firefox only grants pointer lock while the original user gesture is
      // still active. Lock immediately; Godot finishes loading afterwards.
      canvas.focus();
      if (!document.pointerLockElement && canvas.requestPointerLock) {
        try {
          const lockRequest = canvas.requestPointerLock();
          if (lockRequest && typeof lockRequest.catch === 'function') lockRequest.catch(() => {});
        } catch (_error) {
          // A later click on the running canvas can request it again.
        }
      }
      starting = true;
      play.disabled = true;
      copy.textContent = 'ВАРИМ КОФЕ И ЗАГРУЖАЕМ КВАРТИРУ…';
      progress.style.display = 'block';
      notice.style.display = 'none';
      await Promise.all(Array.from(audioContexts, (context) => muted ? context.suspend() : context.resume()));
      engine.startGame({
        onProgress(current, total) {
          if (current > 0 && total > 0) {
            progress.value = current;
            progress.max = total;
            percent.textContent = Math.round(current / total * 100) + '%';
          } else {
            progress.removeAttribute('value');
            percent.textContent = '';
          }
        },
      }).then(() => {
        running = true;
        toolbar.style.display = 'flex';
        status.classList.add('hidden');
        canvas.focus();
        if (resetAfterStart) window.dispatchEvent(new Event('denis-reset-save'));
      }, setFailure);
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else canvas.requestFullscreen().catch(setFailure);
    }

    async function toggleSound() {
      muted = !muted;
      await Promise.all(Array.from(audioContexts, (context) => muted ? context.suspend() : context.resume()));
      document.querySelectorAll('[data-sound]').forEach((button) => {
        button.textContent = button.closest('#toolbar') ? (muted ? '🔇' : '🔊') : ('ЗВУК: ' + (muted ? 'ВЫКЛ' : 'ВКЛ'));
      });
    }

    function resetSave() {
      if (!confirm('Удалить локальное сохранение, достижения и обучение этой игры?')) return;
      if (!running) {
        resetAfterStart = true;
        startGame();
        return;
      }
      window.dispatchEvent(new Event('denis-reset-save'));
    }

    window.addEventListener('denis-save-reset-complete', () => setTimeout(() => location.reload(), 350));
    play.addEventListener('click', startGame);
    document.querySelectorAll('[data-fullscreen]').forEach((button) => button.addEventListener('click', toggleFullscreen));
    document.querySelectorAll('[data-sound]').forEach((button) => button.addEventListener('click', toggleSound));
    document.querySelectorAll('[data-reset]').forEach((button) => button.addEventListener('click', resetSave));
    document.querySelectorAll('[data-controls]').forEach((button) => button.addEventListener('click', () => dialog.classList.add('open')));
    document.getElementById('close-dialog').addEventListener('click', () => dialog.classList.remove('open'));
    dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.classList.remove('open'); });
    window.addEventListener('keydown', (event) => { if (event.key === 'Escape' && dialog.classList.contains('open')) dialog.classList.remove('open'); });
  </script>
</body>
</html>
